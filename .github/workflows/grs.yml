name: Update README cards

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      STATS_EXCLUDED_REPOS: Anomalous-Coffee-Machine,Assassin-s-Creed,BLACK-SOULS,CorpseParty,cult-of-the-lamb,DELTARUNE,DevilMayCry,Dolphin,DuckStation,Gopher64,LordOfTheMysteriesLN,MiSideFull,MonogatariLN,MushokuTenseiLN,nunholy,omori,omori_old,PCSX2,PPSSPP,RetroArch,ReZeroLN,RPCS3,SaveScummer,shadPS4,TheBook
      TOP_LANGS_EXCLUDED_REPOS: apps-mcu-lcd,DiscordTheme,ds-project,dungeon-looter,dwm,fish,java2,learn-jap,mpv,notes,nur-packages,nur-packages-old,nvim,nvim-old,opencode,pebor-nvim,SecureVPN,skj,skj-project,spins-backend,spins-frontend,st,std,stoneblock-cpp,uro,uro-project,usage,usage-old

    permissions:
      contents: write

    steps:
      - name: Verify stats token
        env:
          README_STATS_TOKEN: ${{ secrets.README_STATS_TOKEN }}
        run: |
          if [[ -z "$README_STATS_TOKEN" ]]; then
            echo "::error::README_STATS_TOKEN repository secret is required for private repository stats"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&show_icons=true&theme=nord&exclude_repo=${{ env.STATS_EXCLUDED_REPOS }}
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test profile stats generators
        run: node --test .github/scripts/*.test.mjs

      - name: Generate language stats
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          README_STATS_TOKEN: ${{ secrets.README_STATS_TOKEN }}
        run: node .github/scripts/generate-language-stats.mjs

      - name: Generate repository stargazers
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          README_STATS_TOKEN: ${{ secrets.README_STATS_TOKEN }}
          STATS_EXCLUDED_REPOS: ${{ env.STATS_EXCLUDED_REPOS }}
        run: node .github/scripts/generate-repository-stargazers.mjs

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg profile/languages.txt profile/starred.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update README stats"
          git push
